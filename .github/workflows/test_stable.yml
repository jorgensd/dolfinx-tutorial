name: Test stable release

# Runs the tests of the tutorial in the DOLFINx image of a release. The deploy workflow uses this
# to test each release it builds before publishing it, and it uploads a mark of whether the tests
# passed. On a pull request (or by hand) it tests the code in the image of the newest release, as
# listed by .github/docs-versions.toml, to show whether it works in the newest DOLFINx release.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit to test"
        type: string
        required: true
      image:
        description: "DOLFINx image to test in"
        type: string
        required: true
      asset:
        description: "Tarball of the HTML of the commit, named in the mark of whether the tests passed"
        type: string
        default: ""

jobs:
  latest:
    if: ${{ !inputs.image }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.latest.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Find the newest release
        id: latest
        run: python3 .github/scripts/docs_site.py latest

  test:
    needs: latest
    if: ${{ !cancelled() && (inputs.image || needs.latest.result == 'success') }}
    runs-on: ubuntu-latest
    container: ${{ inputs.image || needs.latest.outputs.image }}
    env:
      DEB_PYTHON_INSTALL_LAYOUT: deb_system
      PYVISTA_OFF_SCREEN: true
      PYVISTA_JUPYTER_BACKEND: html
      LIBGL_ALWAYS_SOFTWARE: 1
      CC: "mpicc"
      HDF5_MPI: "ON"
      HDF5_INCLUDEDIR: "/usr/include/hdf5/openmpi"
      H5PY_SETUP_REQUIRES: 0
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      PRTE_MCA_rmaps_default_mapping_policy: :oversubscribe
      ASSET: ${{ inputs.asset }}

    defaults:
      run:
        working-directory: tutorial

    steps:
      # The install action comes from the commit of this workflow, as older tags may not have it
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: tutorial

      - id: install
        uses: ./.github/actions/install-dependencies

      - name: Install additional deps
        run: |
          python3 -m pip install -U pip setuptools pkgconfig poetry-core poetry_dynamic_versioning
          python3 -m pip install --no-binary=h5py --no-build-isolation .[netgen]

      - name: Test complex notebooks in parallel
        working-directory: tutorial/chapter1
        run: |
          export PKG_CONFIG_PATH=/usr/local/dolfinx-complex/lib/pkgconfig:$PKG_CONFIG_PATH
          export PETSC_ARCH=linux-gnu-complex128-32
          # Where the Python packages are depends on the image
          export PYTHONPATH=$(echo /usr/local/dolfinx-complex/lib/python*/dist-packages | tr ' ' ':'):$PYTHONPATH
          export LD_LIBRARY_PATH=/usr/local/dolfinx-complex/lib:$LD_LIBRARY_PATH
          python3 complex_mode.py
          mpirun -n 2 python3 complex_mode.py

      - name: Test chapter 1
        working-directory: tutorial/chapter1
        run: |
          mpirun -n 2 python3 fundamentals_code.py
          mpirun -n 2 python3 nitsche.py
          mpirun -n 2 python3 membrane_code.py

      - name: Test chapter 2
        working-directory: tutorial/chapter2
        run: |
          mpirun -n 2 python3 diffusion_code.py
          mpirun -n 2 python3 heat_code.py
          mpirun -n 2 python3 linearelasticity_code.py
          mpirun -n 2 python3 hyperelasticity.py
          mpirun -n 2 python3 nonlinpoisson_code.py
          mpirun -n 2 python3 ns_code1.py
          mpirun -n 2 python3 ns_code2.py

      - name: Test chapter 3
        working-directory: tutorial/chapter3
        run: |
          mpirun -n 2 python3 neumann_dirichlet_code.py
          mpirun -n 2 python3 multiple_dirichlet.py
          mpirun -n 2 python3 subdomains.py
          mpirun -n 2 python3 robin_neumann_dirichlet.py
          mpirun -n 2 python3 component_bc.py
          mpirun -n 2 python3 em.py

      - name: Test chapter 4
        working-directory: tutorial/chapter4
        run: |
          mpirun -n 2 python3 solvers.py
          mpirun -n 2 python3 convergence.py
          mpirun -n 2 python3 compiler_parameters.py
          mpirun -n 2 python3 newton-solver.py

      - name: Mark the tests as passed
        id: passed
        if: ${{ inputs.asset }}
        working-directory: .
        run: echo "${ASSET%.tar.gz}" > "${ASSET%.tar.gz}.tested"

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.asset }}
        with:
          name: tested-${{ inputs.asset }}
          path: "*.tested"
          retention-days: 2
          if-no-files-found: error

      # So that the deploy workflow doesn't build it again until the mark is deleted. A failure
      # before the tests could run, such as of a checkout, is more likely to be passing.
      - name: Mark the tests as failed
        id: failed
        if: ${{ failure() && inputs.asset && steps.install.outcome == 'success' && steps.passed.outcome != 'success' }}
        working-directory: .
        env:
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WHAT: ${{ inputs.ref }} in ${{ inputs.image }}
        run: |
          echo "Tests of ${WHAT} failed: ${RUN}" > "${ASSET%.tar.gz}.failed"

      - uses: actions/upload-artifact@v7
        if: ${{ failure() && steps.failed.outcome == 'success' }}
        with:
          name: failed-test-${{ inputs.asset }}
          path: "*.failed"
          retention-days: 2

      - name: Upload Navier-Stokes DFG 2D 3 plots
        uses: actions/upload-artifact@v7
        with:
          name: DFG2D-3-${{ inputs.ref || github.sha }}
          path: tutorial/chapter2/figures
          retention-days: 2
          if-no-files-found: error
